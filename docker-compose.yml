services:
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
volumes:
  caddy_data:
